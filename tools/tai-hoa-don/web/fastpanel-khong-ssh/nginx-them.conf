# Dán vào cấu hình nginx của site (FASTPANEL → Sites → site của bạn → Cấu hình/Configuration → nginx),
# bên trong khối server { ... } (hoặc trong location / nếu FASTPANEL để proxy_pass ở đó).
client_max_body_size 80m;        # gắn nhiều PDF / nối file một lần
proxy_read_timeout 900s;         # tải PDF gốc hàng loạt, kết xuất lớn
proxy_send_timeout 900s;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
